<rect x="692.09" y="259.42" class="st7" width="445.58" height="133.78"/>
<text transform="matrix(1 0 0 1 692.086 277.2491)"><tspan x="0" y="0" class="st8 st9">About </tspan><tspan x="0" y="21.6" class="st1 st6">Alex is a 50 year old Insurance agent. He is interested in </tspan><tspan x="0" y="43.2" class="st1 st6">current tech trends, video games, and new tinvesment </tspan><tspan x="0" y="64.8" class="st1 st6">oppertunities. He keeps up with his finances, but doesn&apos;t </tspan><tspan x="0" y="86.4" class="st1 st6">worry too much about money or saving beyond his basic </tspan><tspan x="0" y="108" class="st1 st6">needs.</tspan></text>
<rect x="692.09" y="404.1" class="st7" width="445.58" height="81.27"/>
<text transform="matrix(1 0 0 1 692.086 421.9291)"><tspan x="0" y="0" class="st8 st9">Goals </tspan><tspan x="0" y="21.6" class="st1 st6">As a  professional he is  focused on expanding his busi</tspan><tspan x="414.1" y="21.6" class="st1 st6">-</tspan><tspan x="0" y="43.2" class="st1 st6">ness, and more concerned with sharing experiences.</tspan></text>
<rect x="692.09" y="488.79" class="st7" width="445.58" height="134.05"/>
<text transform="matrix(1 0 0 1 692.086 506.6263)"><tspan x="0" y="0" class="st8 st9">Needs</tspan><tspan x="0" y="21.6" class="st1 st6">He spends most of his time on life experiences, trying </tspan><tspan x="0" y="43.2" class="st1 st6">new things, and testing out new product trends like </tspan><tspan x="0" y="64.8" class="st1 st6">Stitchfix. Birchbox men, Hulu etc. He wants to save time </tspan><tspan x="0" y="86.4" class="st1 st6">where he can. He can advice to spend money where he </tspan><tspan x="0" y="108" class="st1 st6">thinks it really counts.</tspan></text>
<rect x="692.09" y="634.71" class="st7" width="445.58" height="172.06"/>
<text transform="matrix(1 0 0 1 692.086 652.5406)"><tspan x="0" y="0" class="st8 st9">Frustrations/ Fears </tspan><tspan x="0" y="21.6" class="st1 st6">Since he doesn&apos;t worry about money frequently, some</tspan><tspan x="419.45" y="21.6" class="st1 st6">-</tspan><tspan x="0" y="43.2" class="st1 st6">times costs sneak up on him, and he has a higher bill at </tspan><tspan x="0" y="64.8" class="st1 st6">the end of the month than he&apos;d like. He wants to feel </tspan><tspan x="0" y="86.4" class="st1 st6">financially secure while having enough money to travel </tspan><tspan x="0" y="108" class="st1 st6">and experience life.</tspan></text>
